name: Sync Kakao Wiki to Supabase

on:
  schedule:
    - cron: '0 * * * *' # 매 1시간마다 자동 실행
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: 1. 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. Node.js 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. 의존성 패키지 설치
        run: npm install

      - name: 4. 카카오 위키 동기화 스크립트 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KAKAO_WIKI_API_TOKEN: ${{ secrets.KAKAO_WIKI_API_TOKEN }}
        run: node scripts/sync-wiki.js
